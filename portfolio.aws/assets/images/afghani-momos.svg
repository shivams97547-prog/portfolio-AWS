<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="momo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F14" />
      <stop offset="50%" stop-color="#161B26" />
      <stop offset="100%" stop-color="#0A0B10" />
    </linearGradient>
    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#42B8FF" />
    </linearGradient>
    <radialGradient id="glow-dish" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05070D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#momo-bg)" />

  <!-- Subtly lit grid -->
  <g opacity="0.08" stroke="#F59E0B" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Card Container -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#111827" fill-opacity="0.8" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Navigation Mockup -->
  <line x1="50" y1="90" x2="750" y2="90" stroke="#374151" stroke-width="1" />
  <text x="80" y="70" fill="#FBBF24" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="16">AFGHANI MOMOS</text>
  <text x="440" y="70" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12">Menu</text>
  <text x="500" y="70" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12">Specialties</text>
  <text x="585" y="70" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="12">About</text>
  <rect x="650" y="52" width="75" height="26" rx="13" fill="url(#gold-amber)" />
  <text x="670" y="69" fill="#111827" font-family="'Inter', sans-serif" font-weight="bold" font-size="11">Order</text>

  <!-- Left Content Column -->
  <g transform="translate(85, 140)">
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4" />
    <text x="12" y="15" fill="#FBBF24" font-family="'Space Grotesk', monospace" font-size="10">AUTHENTIC CULINARY</text>

    <text x="0" y="55" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28">Crisp, Creamy,</text>
    <text x="0" y="90" fill="url(#gold-amber)" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28">Afghani Infusion.</text>
    
    <text x="0" y="125" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="13" width="280">
      Engineered for mobile delight — seamless culinary ordering,
    </text>
    <text x="0" y="145" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="13">
      flavor showcases, and modern responsive design.
    </text>

    <!-- Buttons -->
    <rect x="0" y="175" width="130" height="38" rx="8" fill="url(#neon-cyan)" />
    <text x="25" y="198" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="bold" font-size="12">Explore Menu</text>
    <rect x="145" y="175" width="120" height="38" rx="8" fill="transparent" stroke="#4B5563" />
    <text x="172" y="198" fill="#D1D5DB" font-family="'Inter', sans-serif" font-size="12">View Story</text>
  </g>

  <!-- Right Visual / Platter Mockup -->
  <g transform="translate(530, 260)">
    <circle cx="0" cy="0" r="140" fill="url(#glow-dish)" />
    <!-- Slate Platter -->
    <ellipse cx="0" cy="10" rx="130" ry="110" fill="#1F2937" stroke="#374151" stroke-width="2" />
    <ellipse cx="0" cy="10" rx="115" ry="95" fill="#111827" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Steamed Dumplings / Momos -->
    <ellipse cx="-40" cy="-20" rx="30" ry="24" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" />
    <path d="M-60 -20 Q -40 -35 -20 -20 Q -40 -5 -60 -20" fill="#E5E7EB" opacity="0.6" />
    
    <ellipse cx="30" cy="-25" rx="32" ry="25" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" />
    <path d="M10 -25 Q 30 -42 50 -25 Q 30 -10 10 -25" fill="#E5E7EB" opacity="0.6" />

    <ellipse cx="-15" cy="35" rx="34" ry="26" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5" />
    <path d="M-38 35 Q -15 18 8 35 Q -15 50 -38 35" fill="#E5E7EB" opacity="0.6" />

    <!-- Creamy Garnish & Herb Specks -->
    <circle cx="45" cy="30" r="18" fill="#DC2626" fill-opacity="0.8" stroke="#EF4444" stroke-width="1" />
    <circle cx="45" cy="30" r="12" fill="#B91C1C" />
    <!-- Spices & Herbs -->
    <circle cx="-35" cy="-20" r="2" fill="#10B981" />
    <circle cx="-45" cy="-15" r="2" fill="#F59E0B" />
    <circle cx="25" cy="-20" r="2" fill="#10B981" />
    <circle cx="35" cy="-30" r="2" fill="#F59E0B" />
    <circle cx="-10" cy="30" r="2.5" fill="#10B981" />
    <circle cx="-20" cy="40" r="2" fill="#F59E0B" />
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(85, 415)">
    <text x="0" y="15" fill="#6B7280" font-family="'Space Grotesk', monospace" font-size="11">STACK: HTML5 // CSS3 // RESPONSIVE GRID // VANILLA JS INTERACTION</text>
  </g>
</svg>