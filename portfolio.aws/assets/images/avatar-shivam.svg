<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>
    <linearGradient id="cyber-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087BFF" />
      <stop offset="100%" stop-color="#42B8FF" />
    </linearGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#avatar-bg)" rx="24" />

  <!-- Hexagonal Tech Border -->
  <polygon points="200,30 350,115 350,285 200,370 50,285 50,115" fill="#0B1220" stroke="url(#cyber-neon)" stroke-width="2.5" opacity="0.8" filter="url(#badge-glow)" />
  <polygon points="200,45 335,123 335,277 200,355 65,277 65,123" fill="#060912" stroke="#087BFF" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Concentric Orbit Ring -->
  <circle cx="200" cy="200" r="115" fill="none" stroke="#42B8FF" stroke-width="1" opacity="0.3" />

  <!-- Avatar Silhouette / Stylized Hologram -->
  <g transform="translate(200, 195)">
    <!-- Head -->
    <ellipse cx="0" cy="-45" rx="36" ry="44" fill="#0E1726" stroke="#42B8FF" stroke-width="2" />
    <!-- Visor / Cybernetic Glasses -->
    <path d="M-30 -48 Q 0 -42 30 -48 L28 -34 Q 0 -28 -28 -34 Z" fill="url(#cyber-neon)" filter="url(#badge-glow)" />
    <!-- Hair outline -->
    <path d="M-36 -50 C-36 -85 -10 -95 10 -90 C25 -86 36 -70 36 -50 C30 -60 10 -65 -10 -62 C-25 -60 -32 -55 -36 -50 Z" fill="#42B8FF" opacity="0.85" />
    <!-- Neck -->
    <rect x="-14" y="-3" width="28" height="25" fill="#0B1220" stroke="#087BFF" stroke-width="1.5" />
    <!-- Shoulders / Torso -->
    <path d="M-65 65 C-60 25 -30 20 -15 20 L15 20 C30 20 60 25 65 65 Z" fill="#0B1220" stroke="#42B8FF" stroke-width="2" />
    <path d="M-30 65 L-12 25 L12 25 L30 65" fill="none" stroke="#087BFF" stroke-width="1.5" stroke-dasharray="4 2" />
  </g>

  <!-- Holographic Floating Elements -->
  <circle cx="95" cy="115" r="4" fill="#42B8FF" filter="url(#badge-glow)" />
  <circle cx="305" cy="115" r="4" fill="#42B8FF" filter="url(#badge-glow)" />
  <circle cx="200" cy="340" r="4" fill="#087BFF" filter="url(#badge-glow)" />

  <!-- Identifier Label -->
  <rect x="110" y="315" width="180" height="26" rx="6" fill="#05070D" stroke="#087BFF" stroke-width="1.5" />
  <text x="200" y="332" fill="#42B8FF" font-family="'Space Grotesk', monospace" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle">SHIVAM KUMAR // DEV</text>
</svg>